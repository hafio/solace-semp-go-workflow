workflow-templates:
  - name: "new-seq"

    inputs:
      required: &required-vars
      - domain
      - system
      - system_topic
      - service_queue_owner
      - non_service_queue_owner
      - aem_client_username

      optional: &optional-vars
        topic_prefix: "SITEA/APP/AIF"

        # access control
        client_profile_name: "cp-it-user"
        acl_profile_name: "acl-it-user-{{ inputs.aem_client_username }}"

        # service queue
        service_queue_name: "TO-{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
        service_queue_owner: ""
        service_queue_dmq: "DMQ/TO-{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
        service_queue_permission: "no-access"
        service_queue_access: exclusive
        service_queue_reject_msg_sender: "always"
        service_queue_ttl: 0
        service_queue_max_redelivery: 0 # -1 = disabled ; 0 = forever ; else redelivery = value
        service_queue_max_spool: 5000
        service_queue_enabled: false
        service_queue_subscription: "{{ inputs.topic_prefix }}/{{ inputs.system_topic }}"

        # mirror queue
        mirror_queue_name: "MIRROR/TO-{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
        mirror_queue_owner: "{{ inputs.non_service_queue_owner }}"
        mirror_queue_dmq: "#DMQ_LAST_VALUE"
        mirror_queue_permission: "no-access"
        mirror_queue_access: exclusive
        mirror_queue_reject_msg_sender: "when-queue-enabled"
        mirror_queue_ttl: 1296000 # 15 days
        mirror_queue_max_spool: 5000
        mirror_queue_enabled: false
        mirror_queue_subscription: "{{ inputs.topic_prefix }}/{{ inputs.system_topic }}"

        # dmq
        dmq_name: "DMQ/TO-{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
        dmq_owner: "{{ inputs.non_service_queue_owner }}"
        dmq_dmq: "#DEAD_MSG_QUEUE"
        dmq_permission: "no-access"
        dmq_access: exclusive
        dmq_ttl: 7776000 # 90 days
        dmq_max_spool: 5000
        dmq_enabled: false

    actions: &outbound-new

    # ── Access Control ──────────────────────────────────────────────────────
    - name: "Create Client Profile"
      module: "msg_vpn_client_profile.add"
      args:
        client_profile_name: "{{ inputs.client_profile_name }}"

    - name: "Update Client Profile"
      module: "msg_vpn_client_profile.update"
      args:
        client_profile_name: "{{ inputs.client_profile_name }}"
        allow_guaranteed_msg_send_enabled: true
        allow_guaranteed_msg_receive_enabled: true

    - name: "Create ACL Profile"
      module: "msg_vpn_acl_profile.add"
      args:
        acl_profile_name: "{{ inputs.acl_profile_name }}"
        client_connect_default_action: "allow"
        publish_topic_default_action: "disallow"
        subscribe_topic_default_action: "disallow"

    - name: "Create Client Username"
      module: "msg_vpn_client_username.add"
      args:
        client_username: "{{ inputs.aem_client_username }}"
        client_profile_name: "{{ inputs.client_profile_name }}"
        acl_profile_name: "{{ inputs.acl_profile_name }}"
        enabled: true

    - name: "Update Client Username Association"
      module: "msg_vpn_client_username.update"
      args:
        client_username: "{{ inputs.aem_client_username }}"
        client_profile_name: "{{ inputs.client_profile_name }}"
        acl_profile_name: "{{ inputs.acl_profile_name }}"

    - name: "Add ACL Publish Topic Exception"
      module: "msg_vpn_acl_profile_publish_topic_exception.add"
      args:
        acl_profile_name: "{{ inputs.acl_profile_name }}"
        publish_topic_exception: "{{ inputs.service_queue_subscription }}"
        publish_topic_exception_syntax: "smf"

    # ── Queues ──────────────────────────────────────────────────────────────
    - name: "Create Service Queue"
      module: "msg_vpn_queue.add"
      args:
        queue_name: "{{ inputs.service_queue_name }}"
        owner: "{{ inputs.service_queue_owner }}"
        access_type: "{{ inputs.service_queue_access }}"
        permission: "{{ inputs.service_queue_permission }}"
        dead_msg_queue: "{{ inputs.service_queue_dmq }}"
        ingress_enabled: "{{ inputs.service_queue_enabled }}"
        egress_enabled: "{{ inputs.service_queue_enabled }}"
        max_ttl: "{{ inputs.service_queue_ttl }}"
        max_redelivery_count: "{{ inputs.service_queue_max_redelivery }}"
        reject_msg_to_sender_on_discard_behavior: "{{ inputs.service_queue_reject_msg_sender }}"
    - name: "Create Mirror Queue"
      module: "msg_vpn_queue.add"
      args:
        queue_name: "{{ inputs.mirror_queue_name }}"
        owner: "{{ inputs.mirror_queue_owner }}"
        access_type: "{{ inputs.mirror_queue_access }}"
        permission: "{{ inputs.mirror_queue_permission }}"
        dead_msg_queue: "{{ inputs.mirror_queue_dmq }}"
        ingress_enabled: "{{ inputs.mirror_queue_enabled }}"
        egress_enabled: "{{ inputs.mirror_queue_enabled }}"
        max_ttl: "{{ inputs.mirror_queue_ttl }}"
        reject_msg_to_sender_on_discard_behavior: "{{ inputs.mirror_queue_reject_msg_sender }}"
    - name: "Create DMQ"
      module: "msg_vpn_queue.add"
      args:
        queue_name: "{{ inputs.dmq_name }}"
        owner: "{{ inputs.dmq_owner }}"
        access_type: "{{ inputs.dmq_access }}"
        permission: "{{ inputs.dmq_permission }}"
        dead_msg_queue: "{{ inputs.dmq_dmq }}"
        ingress_enabled: "{{ inputs.dmq_enabled }}"
        egress_enabled: "{{ inputs.dmq_enabled }}"
        max_ttl: "{{ inputs.dmq_ttl }}"

    # ── Subscriptions ───────────────────────────────────────────────────────
    - name: "Add Service Queue Subscription"
      module: "msg_vpn_queue_subscription.add"
      args:
        queue_name: "{{ inputs.service_queue_name }}"
        subscription_topic: "{{ inputs.service_queue_subscription }}"
    - name: "Add Mirror Queue Subscription"
      module: "msg_vpn_queue_subscription.add"
      args:
        queue_name: "{{ inputs.mirror_queue_name }}"
        subscription_topic: "{{ inputs.mirror_queue_subscription }}"

  - name: "new-non-seq"

    inputs:
      required: *required-vars
      optional:
        <<: *optional-vars
        # service queue redelivery different
        service_queue_max_redelivery: 5 # -1 = disabled ; 0 = forever ; else redelivery = value

    actions: *outbound-new

  - name: "delete"

    inputs:
      required:
      - domain
      - system
      - system_topic
      - aem_client_username

      optional:
        topic_prefix: "SITEA/APP/AIF"
        acl_profile_name: "acl-it-user-{{ inputs.aem_client_username }}"
        service_queue_name: "TO-{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
        mirror_queue_name: "MIRROR/TO-{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
        dmq_name: "DMQ/TO-{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
        service_queue_subscription: "{{ inputs.topic_prefix }}/{{ inputs.system_topic }}"

    actions:
    # ── Queue Cleanup ───────────────────────────────────────────────────────
    - name: "Delete Service Queue"
      module: "msg_vpn_queue.delete"
      args:
        queue_name: "{{ inputs.service_queue_name }}"
    - name: "Delete Mirror Queue"
      module: "msg_vpn_queue.delete"
      args:
        queue_name: "{{ inputs.mirror_queue_name }}"
    - name: "Delete DMQ"
      module: "msg_vpn_queue.delete"
      args:
        queue_name: "{{ inputs.dmq_name }}"

    # ── Access Control Cleanup ──────────────────────────────────────────────
    - name: "Remove ACL Publish Topic Exception"
      module: "msg_vpn_acl_profile_publish_topic_exception.delete"
      args:
        acl_profile_name: "{{ inputs.acl_profile_name }}"
        publish_topic_exception: "{{ inputs.service_queue_subscription }}"
        publish_topic_exception_syntax: "smf"

    - name: "Delete Client Username"
      module: "msg_vpn_client_username.delete"
      args:
        client_username: "{{ inputs.aem_client_username }}"

    - name: "Delete ACL Profile"
      module: "msg_vpn_acl_profile.delete"
      args:
        acl_profile_name: "{{ inputs.acl_profile_name }}"
