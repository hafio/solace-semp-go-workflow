# =============================================================================
# SEMP Workflow Automation - Configuration File
# =============================================================================
# This file defines:
#   1. SEMP broker connection details
#   2. Global variables shared across all workflows
#   3. Workflow entries referencing templates with specific inputs
 
semp:
  host: "https://broker.example.com:443"
  username: "***************"
  password: "***************"
  msg_vpn: "test01"
  verify_ssl: false
  timeout: 30
 
global_vars:
  # Topic hierarchy
  topic_prefix: "SITEA/APP/AIF"

  # Client Access Control
  default_client_profile: "cp-it-user"
  default_acl_profile: "acl-it-user-{{ inputs.aem_client_username }}"
 
  # Queue ownership
  default_queue_owner: "svc-app-client"
  queues_enabled: true
 
  # Queue naming conventions
  default_to_service_queue_name: "TO-{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
  default_from_service_queue_name: "FROM-{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
  default_mirror_queue_name: "MIRROR/{{ inputs.system_topic }}"
  default_outbound_dmq_name: "DMQ/TO-{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
  default_inbound_dmq_name: "DMQ/FROM-{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
 
  # Queue TTL defaults (seconds; 0 = disabled)
  default_service_queue_ttl: 1296000  # 15 days
  default_mirror_queue_ttl: 3240000   # 90 days
  default_dmq_ttl: 3240000
 
  # Queue behaviour defaults
  default_service_queue_reject_msg_sender: "always"
  default_mirror_queue_reject_msg_sender: "when-queue-enabled"
 
  # RDP / REST consumer defaults
  default_rdp_name: "RDP/{{ inputs.domain }}-{{ inputs.system }}-{{ inputs.system_topic }}"
  default_rdp_client_profile: "default"
  default_rc_name: "RC-APP-REST"
  default_rc_remote_host: ""
  default_rc_remote_port: 80
  default_rc_tls_enabled: true
  default_rc_auth_scheme: "http-basic" 
  default_rc_auth_username: ""
  default_rc_rc_auth_password: ""
  default_qb_post_request_target: ""
 
# Workflow templates directory (relative to this config file)
templates_dir: "templates"
 
